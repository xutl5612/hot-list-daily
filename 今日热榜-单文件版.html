<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>今日热榜 · 全网热搜观察笔记</title>
  <meta name="description" content="今日热榜 —— 一个记录全网热搜、热播与热点观察的个人博客。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23e0553c'/><text x='16' y='22' font-size='18' text-anchor='middle' fill='white' font-family='sans-serif'>热</text></svg>">
  <style>
/* ===== 今日热榜 · 基础变量 ===== */
:root {
  --bg: #f5f6f7;
  --bg-soft: #eceef0;
  --card: #ffffff;
  --text: #1c1e21;
  --text-dim: #6b7280;
  --text-faint: #9aa1ab;
  --border: #e3e6ea;
  --accent: #e0553c;
  --accent-soft: #fdeeeb;
  --accent-2: #2f6fed;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 4px 14px rgba(16, 24, 40, .05);
  --radius: 12px;
  --radius-sm: 8px;
  --maxw: 1120px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
  --mono: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
}

html[data-theme="dark"] {
  --bg: #16181c;
  --bg-soft: #1d2025;
  --card: #1e2228;
  --text: #e6e8eb;
  --text-dim: #9aa3ae;
  --text-faint: #6b7280;
  --border: #2c3138;
  --accent: #ff6f56;
  --accent-soft: #35211d;
  --accent-2: #6d9bff;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
img { max-width: 100%; }

.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 20px; }

/* ===== 顶栏 ===== */
.header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: color-mix(in srgb, var(--card) 88%, transparent);
  backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid var(--border);
}
.header-inner {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 20px;
}
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 17px; letter-spacing: -.2px; }
.brand-mark {
  width: 26px; height: 26px; border-radius: 7px;
  background: linear-gradient(135deg, var(--accent), #ff9d4d);
  color: #fff; font-size: 13px; font-weight: 700;
  display: grid; place-items: center;
}
.brand small { display: block; font-size: 11px; font-weight: 500; color: var(--text-faint); letter-spacing: .5px; line-height: 1.1; }

.nav { display: flex; gap: 4px; margin-left: 8px; }
.nav a {
  padding: 6px 12px; border-radius: 999px; font-size: 14px;
  color: var(--text-dim); transition: .15s;
}
.nav a:hover { background: var(--bg-soft); color: var(--text); }
.nav a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

.header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

.search {
  display: flex; align-items: center; gap: 6px;
  background: var(--bg-soft); border: 1px solid transparent;
  border-radius: 999px; padding: 5px 12px; transition: .15s;
}
.search:focus-within { border-color: var(--accent); background: var(--card); }
.search input {
  border: none; outline: none; background: transparent;
  color: var(--text); font-size: 13px; width: 130px; font-family: var(--font);
}
.search svg { flex: none; opacity: .5; }

.icon-btn {
  width: 32px; height: 32px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--card);
  color: var(--text-dim); cursor: pointer; display: grid; place-items: center;
  transition: .15s;
}
.icon-btn:hover { color: var(--accent); border-color: var(--accent); }

/* ===== 布局 ===== */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 28px; padding: 28px 0 60px; align-items: start; }
.layout.single { grid-template-columns: minmax(0, 760px); justify-content: center; }

/* ===== Hero ===== */
.hero {
  background: linear-gradient(135deg, var(--accent) 0%, #ff9a4d 100%);
  border-radius: var(--radius);
  color: #fff; padding: 26px 28px; margin-bottom: 24px;
  box-shadow: var(--shadow);
}
.hero h1 { margin: 0 0 6px; font-size: 24px; letter-spacing: -.4px; }
.hero p { margin: 0; opacity: .92; font-size: 14px; }
.hero-meta { display: flex; gap: 18px; margin-top: 16px; flex-wrap: wrap; }
.hero-meta div { font-size: 12px; opacity: .9; }
.hero-meta b { display: block; font-size: 19px; font-weight: 700; opacity: 1; }

/* ===== 卡片 ===== */
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }

.sec-head { display: flex; align-items: baseline; justify-content: space-between; margin: 28px 0 14px; }
.sec-head h2 { margin: 0; font-size: 17px; letter-spacing: -.2px; display: flex; align-items: center; gap: 8px; }
.sec-head h2::before { content: ""; width: 3px; height: 15px; border-radius: 2px; background: var(--accent); }
.sec-head .more { font-size: 13px; color: var(--text-dim); }
.sec-head .more:hover { color: var(--accent); }

/* 热榜速览 */
.hot { overflow: hidden; }
.hot-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; border-bottom: 1px solid var(--border);
}
.hot-head .t { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 7px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.hot-head .u { font-size: 12px; color: var(--text-faint); }
.hu-wrap { display: flex; align-items: center; }
.refresh-btn {
  width: 24px; height: 24px; margin-right: 9px; flex: none;
  display: grid; place-items: center; border-radius: 6px;
  border: 1px solid var(--border); background: var(--card);
  color: var(--text-dim); cursor: pointer; transition: .15s;
}
.refresh-btn:hover { color: var(--accent); border-color: var(--accent); }
.refresh-btn:disabled { cursor: default; }
.refresh-btn.loading { color: var(--accent); }
.refresh-btn.loading svg { animation: spin .8s linear infinite; }
.refresh-btn.done { color: #16a34a; border-color: #16a34a; }
.refresh-btn.fail { color: var(--accent); border-color: var(--accent); }
@keyframes spin { to { transform: rotate(360deg); } }
.hot-list { max-height: 432px; overflow-y: auto; }
.hot-item {
  display: flex; align-items: center; gap: 12px;
  padding: 9px 16px; border-bottom: 1px solid var(--border); font-size: 14px;
}
.hot-item:last-child { border-bottom: none; }
.hot-item:hover { background: var(--bg-soft); }
.rank { width: 20px; height: 20px; flex: none; border-radius: 5px; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--text-faint); background: var(--bg-soft); }
.hot-item:nth-child(1) .rank, .hot-item:nth-child(2) .rank, .hot-item:nth-child(3) .rank { background: var(--accent); color: #fff; }
.hot-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hot-title:hover { color: var(--accent); }
.src { flex: none; font-size: 11px; padding: 1px 7px; border-radius: 5px; background: var(--bg-soft); color: var(--text-dim); }
.heat { flex: none; font-size: 12px; color: var(--accent); font-variant-numeric: tabular-nums; width: 52px; text-align: right; }

/* 升降趋势标记 */
.trend { flex: none; font-size: 11px; padding: 1px 5px; border-radius: 4px; font-variant-numeric: tabular-nums; }
.trend.is-new { background: var(--accent); color: #fff; font-weight: 700; letter-spacing: .3px; }
.trend.up { color: #e0362a; }     /* 上升：红 */
.trend.down { color: #12a150; }   /* 下降：绿 */
.trend.flat { color: var(--text-faint); opacity: .45; }

/* ===== 热榜风向页 ===== */
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 18px; }
.stat-box { text-align: center; padding: 4px 0; }
.stat-box b { display: block; font-size: 22px; color: var(--accent); font-variant-numeric: tabular-nums; }
.stat-box span { font-size: 12.5px; color: var(--text-dim); }
.insight-card { padding: 16px 18px; }
.stat-row { display: flex; align-items: center; gap: 12px; padding: 5px 0; font-size: 13.5px; }
.stat-lab { flex: none; width: 56px; color: var(--text-dim); }
.stat-bar { flex: 1; height: 8px; border-radius: 4px; background: var(--bg-soft); overflow: hidden; }
.stat-bar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--accent), #ff9a4d); }
.stat-val { flex: none; width: 34px; text-align: right; color: var(--text-dim); font-variant-numeric: tabular-nums; }
.mini-item .hint { display: block; font-style: normal; font-size: 11.5px; color: var(--text-faint); margin-top: 1px; }

/* 提示条 */
.tip {
  background: var(--accent-soft); border: 1px solid var(--border);
  border-left: 3px solid var(--accent); border-radius: var(--radius-sm);
  padding: 11px 14px; margin-bottom: 18px; font-size: 13.5px; color: var(--text-dim);
}
.tip code { background: var(--card); padding: 1px 5px; border-radius: 4px; font-family: var(--mono); font-size: 12.5px; color: var(--accent); }

/* 文章列表 */
.post-list { display: flex; flex-direction: column; gap: 14px; }
.post-card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 18px 20px; box-shadow: var(--shadow); transition: .18s;
}
.post-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.post-card h3 { margin: 0 0 7px; font-size: 17.5px; line-height: 1.45; letter-spacing: -.2px; }
.post-card h3 a:hover { color: var(--accent); }
.post-excerpt { margin: 0 0 12px; color: var(--text-dim); font-size: 14px; line-height: 1.7; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.post-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-faint); }
.post-meta .sep { width: 3px; height: 3px; border-radius: 50%; background: var(--text-faint); opacity: .5; }

.tag-chip {
  font-size: 12px; padding: 2px 9px; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent); transition: .15s;
}
.tag-chip:hover { background: var(--accent); color: #fff; }

/* 侧边栏 */
.side { display: flex; flex-direction: column; gap: 18px; position: sticky; top: 74px; }
.side-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.side-card h4 { margin: 0 0 12px; font-size: 14px; display: flex; align-items: center; gap: 7px; }
.side-card h4::before { content: ""; width: 3px; height: 13px; border-radius: 2px; background: var(--accent); }
.tag-cloud { display: flex; flex-wrap: wrap; gap: 7px; }
.tag-cloud a { font-size: 12.5px; padding: 4px 10px; border-radius: 999px; background: var(--bg-soft); color: var(--text-dim); transition: .15s; }
.tag-cloud a:hover { background: var(--accent); color: #fff; }
.tag-cloud a.on { background: var(--accent); color: #fff; }
.tag-cloud a span { opacity: .6; margin-left: 3px; font-size: 11px; }

.mini-list { display: flex; flex-direction: column; gap: 11px; }
.mini-item { display: flex; gap: 9px; font-size: 13.5px; line-height: 1.5; }
.mini-item .n { flex: none; width: 17px; height: 17px; border-radius: 4px; background: var(--bg-soft); color: var(--text-faint); font-size: 11px; display: grid; place-items: center; font-weight: 700; margin-top: 3px; }
.mini-item:hover a { color: var(--accent); }

.about-mini p { margin: 0; font-size: 13.5px; color: var(--text-dim); line-height: 1.7; }
.about-mini .btn { display: inline-block; margin-top: 12px; font-size: 13px; color: var(--accent); font-weight: 600; }

/* ===== 文章详情 ===== */
.article { padding: 32px 36px; }
.article-head { border-bottom: 1px solid var(--border); padding-bottom: 18px; margin-bottom: 26px; }
.article-head h1 { margin: 10px 0 12px; font-size: 27px; line-height: 1.4; letter-spacing: -.5px; }
.article-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--text-faint); }

.md { font-size: 15.5px; line-height: 1.85; color: var(--text); }
.md h2 { font-size: 20px; margin: 34px 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--border); letter-spacing: -.3px; }
.md h3 { font-size: 16.5px; margin: 26px 0 10px; }
.md h4 { font-size: 15px; margin: 20px 0 8px; color: var(--text-dim); }
.md p { margin: 0 0 15px; }
.md ul, .md ol { margin: 0 0 16px; padding-left: 22px; }
.md li { margin-bottom: 6px; }
.md li::marker { color: var(--accent); }
.md strong { color: var(--text); font-weight: 600; }
.md a { color: var(--accent-2); text-decoration: underline; text-underline-offset: 2px; }
.md blockquote {
  margin: 18px 0; padding: 12px 16px; border-left: 3px solid var(--accent);
  background: var(--accent-soft); border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  color: var(--text); font-size: 14.5px;
}
.md blockquote p:last-child { margin-bottom: 0; }
.md code {
  background: var(--bg-soft); padding: 2px 6px; border-radius: 4px;
  font-family: var(--mono); font-size: 13px; color: var(--accent);
}
.md pre {
  background: var(--bg-soft); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 14px 16px; overflow-x: auto; margin: 0 0 18px; line-height: 1.65; position: relative;
}
.md pre code { background: none; padding: 0; color: var(--text); font-size: 13px; }

/* 代码块语言标签 */
.md pre[data-lang]:not([data-lang="text"])::after {
  content: attr(data-lang);
  position: absolute; top: 6px; right: 11px;
  font-size: 10px; letter-spacing: .6px; text-transform: uppercase;
  color: var(--text-faint); pointer-events: none; user-select: none;
}
/* 语法高亮配色 */
.tok-kw { color: #d73a49; }
.tok-str { color: #0a3069; }
.tok-cm { color: #6e7781; font-style: italic; }
.tok-num { color: #0550ae; }
html[data-theme="dark"] .tok-kw { color: #ff7b72; }
html[data-theme="dark"] .tok-str { color: #a5d6ff; }
html[data-theme="dark"] .tok-cm { color: #8b949e; }
html[data-theme="dark"] .tok-num { color: #79c0ff; }
.md table { width: 100%; border-collapse: collapse; margin: 0 0 18px; font-size: 14px; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
.md th { background: var(--bg-soft); font-weight: 600; }
.md hr { border: none; border-top: 1px solid var(--border); margin: 28px 0; }

.toc {
  background: var(--bg-soft); border-radius: var(--radius-sm);
  padding: 14px 16px; margin-bottom: 26px; font-size: 13.5px;
}
.toc b { display: block; margin-bottom: 8px; font-size: 13px; color: var(--text-dim); }
.toc a { display: block; padding: 3px 0; color: var(--text-dim); }
.toc a.lv3 { padding-left: 14px; font-size: 13px; opacity: .85; }
.toc a:hover { color: var(--accent); }

.article-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border); }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }
.pager a { padding: 14px 16px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); font-size: 13.5px; box-shadow: var(--shadow); }
.pager a:hover { border-color: var(--accent); }
.pager .lab { display: block; font-size: 11.5px; color: var(--text-faint); margin-bottom: 4px; }
.pager .next { text-align: right; }

/* ===== 标签页 ===== */
.page-head { padding: 30px 0 8px; }
.page-head h1 { margin: 0 0 8px; font-size: 26px; letter-spacing: -.4px; }
.page-head p { margin: 0; color: var(--text-dim); font-size: 14px; }

.tag-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; margin: 24px 0 40px; }
.tag-box { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); transition: .18s; }
.tag-box:hover { border-color: var(--accent); transform: translateY(-2px); }
.tag-box .name { font-weight: 600; font-size: 15.5px; margin-bottom: 5px; }
.tag-box .cnt { font-size: 12.5px; color: var(--text-faint); margin-bottom: 10px; }
.tag-box .bar { height: 4px; border-radius: 2px; background: var(--bg-soft); overflow: hidden; }
.tag-box .bar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }

/* ===== 关于页 ===== */
.about-hero { display: flex; gap: 20px; align-items: center; padding: 26px; margin-bottom: 20px; }
.avatar {
  width: 64px; height: 64px; flex: none; border-radius: 18px;
  background: linear-gradient(135deg, var(--accent), #ff9a4d);
  color: #fff; display: grid; place-items: center; font-size: 24px; font-weight: 700;
}
.about-hero h1 { margin: 0 0 5px; font-size: 21px; }
.about-hero p { margin: 0; color: var(--text-dim); font-size: 14px; }

/* ===== 页脚 ===== */
.footer { border-top: 1px solid var(--border); background: var(--card); padding: 26px 0; margin-top: 20px; }
.footer .wrap { display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--text-faint); }
.footer a:hover { color: var(--accent); }

.empty { padding: 60px 20px; text-align: center; color: var(--text-faint); }

/* ===== 无障碍：键盘焦点 ===== */
a:focus-visible, button:focus-visible, input:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 6px;
}

/* ===== 底部导航（移动端） ===== */
.tabbar { display: none; }

/* ===== 响应式 ===== */
@media (max-width: 900px) {
  .layout, .layout.single { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; }
  .search input { width: 90px; }
}
@media (max-width: 640px) {
  .nav { display: none; }
  .brand small { display: none; }
  .article { padding: 22px 18px; }
  .article-head h1 { font-size: 22px; }
  .hero { padding: 20px; }
  .hero h1 { font-size: 20px; }
  .pager { grid-template-columns: 1fr; }
  .pager .next { text-align: left; }
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
  .trend.flat { display: none; }

  /* 顶部导航隐藏后，改用底部 Tab 栏导航 */
  body { padding-bottom: 62px; }
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
    display: flex;
    background: color-mix(in srgb, var(--card) 94%, transparent);
    backdrop-filter: saturate(180%) blur(12px);
    border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .tabbar a {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 7px 0 6px; font-size: 11px; color: var(--text-faint); transition: .15s;
  }
  .tabbar a svg { width: 21px; height: 21px; }
  .tabbar a.active { color: var(--accent); font-weight: 600; }
}

/* ===== 减弱动画偏好 ===== */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
}

</style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a class="brand" href="#/">
        <span class="brand-mark">热</span>
        <span>今日热榜<small>HOT LIST DAILY</small></span>
      </a>

      <nav class="nav">
        <a href="#/" data-nav="home">首页</a>
        <a href="#/insights" data-nav="insights">热榜风向</a>
        <a href="#/tags" data-nav="tags">标签分类</a>
        <a href="#/about" data-nav="about">关于</a>
      </nav>

      <div class="header-right">
        <form class="search" onsubmit="return false;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
            <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
          </svg>
          <input id="q" type="search" placeholder="搜索文章…" autocomplete="off">

  // 热度值各平台单位不同，统一做「万 / 亿」缩写
  function fmtHeat(h) {
    var n = parseFloat(String(h).replace(/[^0-9.]/g, ''));
    if (!n) return esc(h);
    if (n >= 1e8) return (n / 1e8).toFixed(1) + '亿';
    if (n >= 1e4) return (n / 1e4).toFixed(1) + '万';
    return String(n);
  }

  /* ---------- 代码块轻量语法高亮（零依赖） ---------- */
  var KEYWORDS = {
    python: ('def class return if elif else for while in not and or is None True False ' +
      'try except finally with as lambda import from raise pass yield assert global ' +
      'async await continue break print int str bool float list dict set tuple len range self').split(' '),
    javascript: ('const let var function return if else for while do switch case class new this ' +
      'null undefined true false import export from default try catch finally typeof ' +
      'instanceof async await throw delete in of continue break extends super yield static get set').split(' '),
    json: 'true false null'.split(' '),
    bash: ('if then fi for do done echo cd ls sudo apt yum pip python git curl ' +
      'mkdir rm cp mv export source chmod').split(' '),
    sql: ('select from where insert into update delete create table join on group order ' +
      'by limit having as and or not null values set').split(' ')
  };
  KEYWORDS.js = KEYWORDS.javascript;
  KEYWORDS.py = KEYWORDS.python;
  KEYWORDS.shell = KEYWORDS.bash;

  // 只转义 < > &：代码内容是文本节点，引号无需转义，方便后续按原文做词法处理
  function escCode(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function hl(code, lang) {
    var src = escCode(code);
    var store = [];
    // 占位符延后在最后统一插入标签，避免关键字匹配到 class 名导致 HTML 被破坏
    function keep(cls, txt) {
      store.push([cls, txt]);
      return '\u0001' + (store.length - 1) + '\u0002';
    }
    if (lang === 'python') {
      src = src.replace(/(#[^\n]*)/g, function (_, c) { return keep('cm', c); });
    }
    if (lang === 'javascript' || lang === 'js') {
      src = src.replace(/(\/\/[^\n]*)/g, function (_, c) { return keep('cm', c); });
    }
    src = src.replace(/('[^'\n]*'|"[^"\n]*")/g, function (_, s) { return keep('str', s); });
    src = src.replace(/\b(\d+(?:\.\d+)?)\b/g, function (_, n) { return keep('num', n); });
    (KEYWORDS[lang] || []).forEach(function (k) {
      src = src.replace(new RegExp('\\b' + k + '\\b', 'g'), '\u0003' + k + '\u0004');
    });
    src = src.replace(/\u0001(\d+)\u0002/g, function (_, i) {
      var it = store[+i];
      return '<span class="tok-' + it[0] + '">' + it[1] + '</span>';
    });
    src = src.replace(/\u0003([^\u0004]*)\u0004/g, function (_, w) {
      return '<span class="tok-kw">' + w + '</span>';
    });
    return src;
  }

  function highlightBlocks() {
    Array.prototype.forEach.call(app.querySelectorAll('pre code'), function (el) {
      var m = /language-([\w-]+)/.exec(el.className || '');
      var lang = m ? m[1].toLowerCase() : 'text';
      var pre = el.parentNode;
      if (pre) pre.setAttribute('data-lang', lang);
      if (lang === 'text' || !KEYWORDS[lang]) return;
      el.innerHTML = hl(el.textContent, lang);
    });
  }

  function fmtDate(d) {
    var p = d.split('-');
    return p[0] + ' 年 ' + Number(p[1]) + ' 月 ' + Number(p[2]) + ' 日';
  }
  function fmtShort(d) { return d.slice(5).replace('-', '/'); }

  marked.setOptions({ gfm: true, breaks: false });

  /* ---------- 组件 ---------- */
  function postCard(p) {
    return '<article class="post-card">' +
      '<h3><a href="#/post/' + p.slug + '">' + esc(p.title) + '</a></h3>' +
      '<p class="post-excerpt">' + esc(p.excerpt) + '</p>' +
      '<div class="post-meta">' +
        '<span>' + fmtDate(p.date) + '</span><i class="sep"></i>' +
        '<span>约 ' + readingTime(p.body) + ' 分钟</span><i class="sep"></i>' +
        p.tags.map(function (t) {
          return '<a class="tag-chip" href="#/tag/' + t + '">' + esc(tagName(t)) + '</a>';
        }).join('') +
      '</div></article>';
  }

  // 升降趋势标记：上升红、下降绿（符合国内阅读习惯），新上榜单独标记
  function trendBadge(it) {
    if (it.isNew) return '<span class="trend is-new">NEW</span>';
    var d = Number(it.delta) || 0;
    if (d > 0) return '<span class="trend up">↑' + d + '</span>';
    if (d < 0) return '<span class="trend down">↓' + Math.abs(d) + '</span>';
    return '<span class="trend flat">—</span>';
  }

  function hotTip(it) {
    var t = it.track;
    if (!t) return esc(it.title);
    return esc(it.title) + '\n首次上榜：' + esc(t.first) +
      '\n累计上榜：' + t.hits + ' 次' +
      '\n最高排名：第 ' + t.best + ' 位';
  }

  function itemRow(it) {
    return '<div class="hot-item"><span class="rank">' + it.rank + '</span>' +
      '<a class="hot-title" href="' + esc(it.url) + '" target="_blank" rel="noopener" title="' + hotTip(it) + '">' + esc(it.title) + '</a>' +
      trendBadge(it) +
      '<span class="src">' + esc(it.source) + '</span>' +
      '<span class="heat">' + fmtHeat(it.heat) + '</span></div>';
  }

  function itemsHtml(list) { return list.map(itemRow).join(''); }

  function hotItemsHtml(limit) {
    return itemsHtml(HOT.items.slice(0, limit || HOT.items.length));
  }

  function hotPanel(limit) {
    var lim = limit || 12;
    return '<section class="card hot">' +
      '<div class="hot-head"><span class="t"><i class="dot"></i>今日热榜速览</span>' +
      '<span class="hu-wrap"><button class="refresh-btn" id="hot-refresh" type="button" ' +
      'title="刷新热榜（每 5 分钟自动）" aria-label="刷新热榜">' + REFRESH_SVG + '</button>' +
      '<span class="u" data-hot-updated>更新于 ' + esc(HOT.updatedAt) + '</span></span></div>' +
      '<div class="hot-list" data-hot-list data-hot-limit="' + lim + '">' + hotItemsHtml(lim) + '</div></section>';
  }

  function sideBar(activeTag) {
    var tops = sorted.slice(0, 5);
    return '<aside class="side">' +
      '<div class="side-card"><h4>标签分类</h4><div class="tag-cloud">' +
        Object.keys(TAGS).map(function (t) {
          return '<a class="' + (t === activeTag ? 'on' : '') + '" href="#/tag/' + t + '">' +
            esc(tagName(t)) + '<span>' + countOf(t) + '</span></a>';
        }).join('') +
      '</div></div>' +
      '<div class="side-card"><h4>最新文章</h4><div class="mini-list">' +
        tops.map(function (p, i) {
          return '<div class="mini-item"><span class="n">' + (i + 1) + '</span>' +
            '<a href="#/post/' + p.slug + '">' + esc(p.title) + '</a></div>';
        }).join('') +
      '</div></div>' +
      '<div class="side-card about-mini"><h4>关于本站</h4>' +
        '<p>一个记录全网热搜、热播与舆论观察的个人博客。不追快，只记值得回头看的东西。</p>' +
        '<a class="btn" href="#/about">了解更多 →</a></div>' +
      '</aside>';
  }

  /* ---------- 页面：首页 ---------- */
  function pageHome() {
    var list = sorted.slice(0, 6);
    return '<div class="wrap"><div class="layout">' +
      '<div>' +
        '<section class="hero"><h1>今天，网上在聊什么？</h1>' +
        '<p>把每天的热搜、热播与热议整理成可读的观察笔记 —— 不追快讯，只记录值得回头看的部分。</p>' +
        '<div class="hero-meta">' +
          '<div><b>' + POSTS.length + '</b>篇观察笔记</div>' +

        '</div></section>' +
        '<div class="sec-head"><h2>今日热榜速览</h2>' +

  /* ---------- 页面：文章详情 ---------- */
  function pagePost(slug) {
    var p = bySlug(slug);
    if (!p) return '<div class="wrap"><div class="empty">没有找到这篇文章 · <a href="#/">返回首页</a></div></div>';

    var raw = marked.parse(p.body);
    var tmp = document.createElement('div');
    tmp.innerHTML = raw;
    var toc = [];
    Array.prototype.forEach.call(tmp.querySelectorAll('h2, h3'), function (h, i) {
      var id = 'sec-' + i;
      h.id = id;
      toc.push({ id: id, text: h.textContent, lv: h.tagName.toLowerCase() === 'h3' ? 3 : 2 });
    });

    var idx = sorted.indexOf(p);
    var prev = sorted[idx - 1], next = sorted[idx + 1];
    var related = sorted.filter(function (o) {
      return o.slug !== p.slug && o.tags.some(function (t) { return p.tags.indexOf(t) > -1; });
    }).slice(0, 5);

    return '<div class="wrap"><div class="layout">' +
      '<div><article class="card article">' +
        '<div class="article-head">' +
          '<div class="article-meta">' +
            p.tags.map(function (t) { return '<a class="tag-chip" href="#/tag/' + t + '">' + esc(tagName(t)) + '</a>'; }).join('') +
          '</div>' +
          '<h1>' + esc(p.title) + '</h1>' +
          '<div class="article-meta"><span>' + fmtDate(p.date) + '</span><i class="sep"></i>' +
            '<span>约 ' + readingTime(p.body) + ' 分钟</span><i class="sep"></i>' +
            '<span>' + p.body.replace(/\s/g, '').length + ' 字</span></div>' +
        '</div>' +
        (toc.length > 2 ? '<nav class="toc"><b>目录</b>' + toc.map(function (t) {
          return '<a class="lv' + t.lv + '" href="javascript:void(0)" data-go="' + t.id + '">' + esc(t.text) + '</a>';
        }).join('') + '</nav>' : '') +
        '<div class="md">' + tmp.innerHTML + '</div>' +
        '<div class="article-tags">' +
          p.tags.map(function (t) { return '<a class="tag-chip" href="#/tag/' + t + '">#' + esc(tagName(t)) + '</a>'; }).join('') +
        '</div>' +
      '</article>' +
      '<div class="pager">' +
        (prev ? '<a href="#/post/' + prev.slug + '"><span class="lab">上一篇</span>' + esc(prev.title) + '</a>' : '<span></span>') +
        (next ? '<a class="next" href="#/post/' + next.slug + '"><span class="lab">下一篇</span>' + esc(next.title) + '</a>' : '<span></span>') +
      '</div></div>' +
      '<aside class="side">' +
        (toc.length > 2 ? '<div class="side-card"><h4>本文目录</h4><div class="mini-list">' +
          toc.map(function (t) {
            return '<div class="mini-item"><span class="n">·</span><a href="javascript:void(0)" data-go="' + t.id + '">' + esc(t.text) + '</a></div>';
          }).join('') + '</div></div>' : '') +
        (related.length ? '<div class="side-card"><h4>相关阅读</h4><div class="mini-list">' +
          related.map(function (r) {
            return '<div class="mini-item"><span class="n">▸</span><a href="#/post/' + r.slug + '">' + esc(r.title) + '</a></div>';
          }).join('') + '</div></div>' : '') +
          '<div class="side-card"><h4>今日热榜</h4>' +
          '<div class="hot-list" data-hot-list data-hot-limit="5">' + hotItemsHtml(5) + '</div></div>' +
      '</aside>' +
      '</div></div>';
  }

          '<div class="cnt">' + c + ' 篇文章</div>' +
          '<div class="bar"><i style="width:' + Math.round(c / max * 100) + '%"></i></div></a>';
      }).join('') + '</div>' +
      '<div class="sec-head"><h2>全部文章</h2></div>' +
      '<div class="post-list">' + sorted.map(postCard).join('') + '</div></div>';

        '<div class="post-list">' + (list.length ? list.map(postCard).join('') :

  /* ---------- 页面：搜索 ---------- */

      '<div class="post-list">' + (list.length ? list.map(postCard).join('') :
        '<div class="empty">没有匹配的结果，换个关键词试试</div>') + '</div></div>';
  }

  /* ---------- 页面：热榜风向（基于历史快照的数据洞察） ---------- */
  function barRow(label, val, max) {
    var w = max ? Math.round(val / max * 100) : 0;
    return '<div class="stat-row"><span class="stat-lab">' + esc(label) + '</span>' +
      '<span class="stat-bar"><i style="width:' + w + '%"></i></span>' +
      '<span class="stat-val">' + val + '</span></div>';
  }

  function statBox(n, label) {
    return '<div class="stat-box"><b>' + n + '</b><span>' + esc(label) + '</span></div>';
  }

  function pageInsights() {
    var s = HOT.stats || {};
    var items = HOT.items || [];
    var srcs = s.sources || {};

    if (!items.length) {
      return '<div class="wrap"><div class="empty">暂无热榜数据 · <a href="#/">返回首页</a></div></div>';
    }

    var maxSrc = Math.max.apply(null, Object.keys(srcs).map(function (k) { return srcs[k]; }).concat([1]));
    var news = items.filter(function (i) { return i.isNew; });
    var ups = items.filter(function (i) { return Number(i.delta) > 0; })
      .sort(function (a, b) { return b.delta - a.delta; }).slice(0, 10);
    var tops = items.slice().sort(function (a, b) {
      return ((b.track && b.track.hits) || 0) - ((a.track && a.track.hits) || 0);
    }).slice(0, 10);

    return '<div class="wrap" data-page="insights">' +
      '<div class="page-head"><h1>热榜风向</h1>' +
        '<p>基于抓取脚本留存的历史快照，观察话题的上榜轨迹与升降趋势' +
        (s.since ? '（数据累计起始于 ' + esc(s.since) + '）' : '') + '</p></div>' +

      (!s.crawls ? '<div class="tip">当前展示的是内置静态快照，尚未接入实时数据。' +
        '通过本地服务运行站点并执行 <code>tools/fetch_hotlist.py</code> 后，' +
        '这里会显示实时趋势、新上榜与在榜轨迹。</div>' : '') +

      '<div class="card stat-grid">' +
        statBox(s.total || items.length, '当前在榜') +
        statBox(Object.keys(srcs).length, '数据来源') +
        statBox(s.newCount || 0, '较上次新上榜') +
        statBox(s.tracked || 0, '已追踪词条') +
      '</div>' +

      '<div class="sec-head"><h2>来源分布</h2>' +
        '<span class="u">累计抓取 ' + (s.crawls || 0) + ' 次 · 上升 ' + (s.upCount || 0) +
        ' / 下降 ' + (s.downCount || 0) + '</span></div>' +
      '<div class="card insight-card">' +
        Object.keys(srcs).map(function (k) { return barRow(k, srcs[k], maxSrc); }).join('') +
      '</div>' +

      (news.length ? '<div class="sec-head"><h2>今日新上榜</h2>' +
        '<span class="u">共 ' + news.length + ' 条</span></div>' +
        '<div class="card hot"><div class="hot-list">' + itemsHtml(news.slice(0, 12)) + '</div></div>' : '') +

      (ups.length ? '<div class="sec-head"><h2>上升最快</h2><span class="u">较上次抓取</span></div>' +
        '<div class="card hot"><div class="hot-list">' + itemsHtml(ups) + '</div></div>' : '') +

      '<div class="sec-head"><h2>在榜最久</h2><span class="u">按累计上榜次数排序</span></div>' +
      '<div class="card insight-card"><div class="mini-list">' +
        tops.map(function (it, i) {
          var t = it.track;
          return '<div class="mini-item"><span class="n">' + (i + 1) + '</span>' +
            '<span>' + esc(it.title) +
            (t ? '<em class="hint"> ' + esc(it.source) + ' · 上榜 ' + t.hits + ' 次 · 最高第 ' + t.best + ' 位</em>' : '') +
            '</span></div>';
        }).join('') +
      '</div></div>' +
      '</div>';
  }

  /* ---------- 路由 ---------- */
  function currentPath() {
    var h = location.hash.replace(/^#/, '');
    return h || '/';
  }

  function render() {
    var path = decodeURIComponent(currentPath());
    var seg = path.split('/').filter(Boolean);
    var html, nav = '';

    if (seg.length === 0) { html = pageHome(); nav = 'home'; }
    else if (seg[0] === 'post' && seg[1]) { html = pagePost(seg[1]); nav = 'home'; }
    else if (seg[0] === 'insights') { html = pageInsights(); nav = 'insights'; }
    else if (seg[0] === 'tags') { html = pageTags(); nav = 'tags'; }
    else if (seg[0] === 'tag' && seg[1]) { html = pageTag(seg[1]); nav = 'tags'; }
    else if (seg[0] === 'about') { html = pageAbout(); nav = 'about'; }
    else if (seg[0] === 'search' && seg[1]) { html = pageSearch(seg[1]); }
    else { html = '<div class="wrap"><div class="empty">页面不存在 · <a href="#/">返回首页</a></div></div>'; }

    app.innerHTML = html;
    highlightBlocks();
    Array.prototype.forEach.call(document.querySelectorAll('[data-nav]'), function (a) {
      a.classList.toggle('active', a.getAttribute('data-nav') === nav);
    });

    if (path === '/' || seg[0] === 'post' || seg[0] === 'tag') window.scrollTo(0, 0);
  }

  /* ---------- 交互 ---------- */
  // 页内目录跳转：避免锚点污染 hash 路由
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('[data-go]');
    if (!a) return;
    e.preventDefault();
    var el = document.getElementById(a.getAttribute('data-go'));
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  // 手动刷新热榜按钮
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('#hot-refresh');
    if (!b || b.disabled) return;
    e.preventDefault();
    b.classList.add('loading');
    b.disabled = true;
    loadHot(function (ok) {
      b.classList.remove('loading');
      b.disabled = false;
      b.classList.add(ok ? 'done' : 'fail');
      b.title = ok ? '已更新' : '刷新失败，使用内置快照';
      setTimeout(function () {
        b.classList.remove('done', 'fail');
        b.title = '刷新热榜（每 5 分钟自动）';
      }, 1600);
    });
  });

  var input = document.getElementById('q');
  input.addEventListener('input', function () {
    var v = input.value.trim();
    if (v) location.hash = '#/search/' + encodeURIComponent(v);
    else if (currentPath().indexOf('/search') === 0) location.hash = '#/';
  });

  var THEME_KEY = 'hotlist-theme';
  var saved = localStorage.getItem(THEME_KEY);
  if (saved) document.documentElement.setAttribute('data-theme', saved);
  document.getElementById('theme-btn').addEventListener('click', function () {
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem(THEME_KEY, next);
  });

  /* ---------- 实时热榜：定时拉取 data/hotlist.json ---------- */
  function refreshHot() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-hot-list]'), function (el) {
      var lim = parseInt(el.getAttribute('data-hot-limit') || '12', 10);
      el.innerHTML = hotItemsHtml(lim);
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-hot-updated]'), function (el) {
      el.textContent = '更新于 ' + esc(HOT.updatedAt);
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-hot-time]'), function (el) {
      el.textContent = esc(HOT.updatedAt.slice(11));
    });
    // 风向页依赖完整统计与轨迹字段，数据到达后需整页重渲染（保持滚动位置不打断）
    if (document.querySelector('[data-page="insights"]')) {
      var y = window.scrollY;
      render();
      window.scrollTo(0, y);
    }
  }

  function loadHot(onDone) {
    fetch('data/hotlist.json', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
      .then(function (d) {
        if (d && d.items && d.items.length) { HOT = d; refreshHot(); if (onDone) onDone(true); }
        else if (onDone) onDone(false);
      })
      .catch(function () { if (onDone) onDone(false); /* file:// 或网络不可达时回退内置快照 */ });
  }

  window.addEventListener('hashchange', render);
  render();
  loadHot();
  setInterval(loadHot, 5 * 60 * 1000);
})();

</script>
</body>
</html>
<script>
window.addEventListener('load', function () {
  setTimeout(function () {
    var out = ['vw=' + window.innerWidth, 'doc=' + document.documentElement.scrollWidth];
    document.querySelectorAll('body *').forEach(function (el) {
      var r = el.getBoundingClientRect();
      if (r.right > window.innerWidth + 1 && r.width > 40) {
        out.push('>>' + (el.className || el.tagName) + ' w=' + Math.round(r.width) + ' right=' + Math.round(r.right));
      }
    });
    document.title = out.slice(0, 15).join(' | ');
  }, 400);
});
</script>
<script>
window.addEventListener('load', function () {
  setTimeout(function () {
    var out = ['vw=' + window.innerWidth, 'doc=' + document.documentElement.scrollWidth];
    document.querySelectorAll('body *').forEach(function (el) {
      var r = el.getBoundingClientRect();
      if (r.right > window.innerWidth + 1 && r.width > 40) out.push('OVER:' + (el.className || el.tagName));
    });
    document.title = out.join(' | ') || 'NO-OVERFLOW';
